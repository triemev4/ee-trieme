<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kickoff · Cliente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#F6F1E4; --surface:#FFFFFF; --surface-2:#EFE7D3;
  --red:#A8791A; --red-deep:#7A5710; --red-glow:rgba(168,121,26,.35);
  --white:#221D12; --gray:#726A57; --gray-dim:#A79C84; --line:#E3D9BE; --vinho:#6E1A2C; --vinho-deep:#4E1020; --vinho-glow:rgba(110,26,44,.28); --ouro-claro:#E2C27A;
  --display:'Space Grotesk',sans-serif; --body:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{background:var(--black); color:var(--white); font-family:var(--body); -webkit-font-smoothing:antialiased;}
::selection{background:var(--red); color:#fff;}
.scroller{height:100vh; overflow-y:auto; scroll-snap-type:y proximity;}
section{min-height:100vh; scroll-snap-align:start; padding:min(9vh,80px) min(8vw,90px); border-bottom:1px solid var(--line); position:relative; display:flex; flex-direction:column; justify-content:center;}
.noise{position:absolute; inset:0; opacity:.035; mix-blend-mode:overlay; pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
h1,h2,h3,h4{font-family:var(--display); font-weight:700; line-height:1.05;}
.h-xl{font-size:clamp(35px,6vw,81px); font-weight:700;}
.h-l{font-size:clamp(29px,4.2vw,53px); font-weight:700; max-width:1000px;}
.h-m{font-size:clamp(21px,2.5vw,31px); font-weight:600; color:var(--gray);}
.lede{font-size:clamp(15px,1.5vw,19px); color:var(--gray); line-height:1.7; max-width:720px;}
.eyebrow{font-family:var(--mono); text-transform:uppercase; font-size:16px; letter-spacing:.14em; color:var(--red); margin-bottom:14px;}
.accent{color:var(--red);}
.abertura-capitulo{font-family:var(--body); font-size:clamp(16px,1.6vw,20px); color:var(--white); font-weight:500; margin:6px 0 26px; max-width:760px; border-left:3px solid var(--red); padding-left:16px;}
.chrome{position:fixed; top:0; left:0; right:0; z-index:50; display:flex; justify-content:space-between; align-items:center; padding:18px min(8vw,90px); font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--gray); pointer-events:none;}
.chrome b{color:var(--white);}
.chrome-logo{height:24px;width:auto;vertical-align:middle;display:inline-block;margin-right:6px;filter:brightness(0);}

.navdots{position:fixed; right:22px; top:50%; transform:translateY(-50%); z-index:50; display:flex; flex-direction:column; gap:10px;}
.navdots button{width:8px; height:8px; border-radius:50%; border:1px solid var(--gray-dim); background:transparent; cursor:pointer; padding:0;}
.navdots button.active{width:10px; height:10px; background:var(--red); border-color:var(--red); box-shadow:0 0 10px var(--red-glow);}
@media(max-width:800px){.navdots{display:none;}}
.r{opacity:0; transform:translateY(28px); transition:opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);}
.r.in{opacity:1; transform:translateY(0);}
.r2{transition-delay:.12s;} .r3{transition-delay:.24s;} .r4{transition-delay:.36s;} .r5{transition-delay:.48s;} .r6{transition-delay:.6s;}
.grid{display:grid; gap:16px;}
.grid.g2{grid-template-columns:repeat(2,1fr);} .grid.g3{grid-template-columns:repeat(3,1fr);} .grid.g4{grid-template-columns:repeat(4,1fr);}
@media(max-width:900px){.grid.g3,.grid.g4{grid-template-columns:repeat(2,1fr);}} @media(max-width:600px){.grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr;}}
.cell{background:var(--surface); border:1.5px solid var(--red); border-radius:10px; padding:24px; transition:background .25s ease, transform .25s ease;}
.cell:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
.cell:hover .d{color:var(--black);}
.cell.warn{background:linear-gradient(160deg, rgba(168,121,26,.14), var(--surface)); border-color:var(--red-deep);}
.cell .k{font-family:var(--mono); text-transform:uppercase; font-size:15px; letter-spacing:.08em; color:var(--red); margin-bottom:12px; line-height:1.4;}
.cell .v{font-family:var(--display); font-size:clamp(23px,2.6vw,35px); font-weight:700;}
.cell .v.red{color:var(--red);}
.cell .d{font-size:16px; color:var(--gray); margin-top:8px; line-height:1.6; transition:color .25s ease;}
.layer{border-left:2px solid var(--line); padding:14px 0 14px 20px; margin-bottom:4px;}
.layer.l2{margin-left:4%;} .layer.l3{margin-left:8%;}
.layer-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
.layer-head .name{font-family:var(--display); font-weight:600; font-size:16px;}
.layer-head .tag{font-family:var(--mono); font-size:10px; color:var(--red); text-transform:uppercase;}
.layer p{color:var(--gray); font-size:15px; line-height:1.6;}
.segcard{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px;}
.segcard .tag{font-family:var(--mono); text-transform:uppercase; color:var(--red); font-size:10.5px; letter-spacing:.1em; margin-bottom:10px; display:block;}
.segcard h4{font-size:18px; margin-bottom:8px;}
.segcard p{color:var(--gray); font-size:14.5px; line-height:1.6;}
.split{display:grid; grid-template-columns:.85fr 1.15fr; gap:34px; align-items:start;}
@media(max-width:820px){.split{grid-template-columns:1fr;}}
.funnel{display:flex; flex-direction:column; gap:8px;}
.funnel .step{display:flex; align-items:center; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:12px 18px;}
.funnel .step .n{font-family:var(--display); color:var(--red); font-weight:700; min-width:26px;}
.funnel .step .name{font-weight:600;}
.funnel .step .tag{margin-left:auto; font-family:var(--mono); font-size:10.5px; color:var(--gray); text-transform:uppercase;}
.pillar{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px;}
.timeline{display:flex; flex-direction:column; gap:10px;}
.phase{display:flex; align-items:flex-start; gap:16px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 20px;}
.phase.prio{background:linear-gradient(160deg, rgba(168,121,26,.16), var(--surface)); border-color:var(--red);}
.phase .badge{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; color:var(--red); border:1px solid var(--red-deep); border-radius:20px; padding:4px 10px; white-space:nowrap;}
.phase .body h4{font-size:15.5px; margin-bottom:4px;}
.phase .body p{color:var(--gray); font-size:14px;}
.chip{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.06em; background:var(--surface-2); border:1px solid var(--line); border-radius:20px; padding:4px 10px; display:inline-block;}
.rtable{width:100%; border-collapse:collapse; font-size:14.5px;}
.rtable th,.rtable td{border:1px solid var(--line); padding:10px 14px; text-align:left;}
.rtable th{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; color:var(--red); letter-spacing:.06em;}
.rtable td.mono{font-family:var(--mono);}
.risk{display:flex; gap:14px; align-items:center; border-top:1px solid var(--line); padding:12px 0;}
.risk .lvl{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; padding:4px 10px; border-radius:20px; white-space:nowrap;}
.risk .lvl.alto{background:rgba(168,121,26,.2); color:#8B3A1A;}
.risk .lvl.medio{background:rgba(168,121,26,.1); color:var(--gray);}
.checklist{display:grid; grid-template-columns:1fr 1fr; gap:10px 24px;}
@media(max-width:700px){.checklist{grid-template-columns:1fr;}}
.checklist div{display:flex; gap:10px; align-items:flex-start; font-size:15px; color:var(--gray);}
.foot{text-align:center; color:var(--gray-dim); font-family:var(--mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; padding-top:40px;}




.bridge-track{display:flex; gap:6px; margin-bottom:36px; flex-wrap:wrap;}
.bridge-track .tk{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; padding:8px 14px; border-radius:20px; border:1px solid var(--line); color:var(--gray-dim);}
.bridge-track .tk.done{color:var(--gray); border-color:var(--gray-dim);}
.bridge-track .tk.now{color:#fff; background:var(--red); border-color:var(--red);}
.bridge-cols{display:grid; grid-template-columns:1fr 1fr; gap:34px;}
@media(max-width:820px){.bridge-cols{grid-template-columns:1fr;}}
.bridge-col .lbl{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--red); margin-bottom:14px;}
.bridge-col ul{list-style:none;}
.bridge-col li{padding:8px 0 8px 22px; position:relative; color:var(--gray); font-size:15.5px; line-height:1.5; border-bottom:1px solid var(--line);}
.bridge-col li::before{content:"➔"; position:absolute; left:0; color:var(--red);}


.agenda-solo{display:flex; flex-direction:column; border-top:1px solid var(--line);}
.agenda-solo .item{display:flex; justify-content:space-between; align-items:center; padding:14px 0; border-bottom:1px solid var(--line);}
.agenda-solo .item .name{font-weight:600; font-size:16px;}
.agenda-solo .item .time{font-family:var(--mono); font-size:12px; color:var(--red); white-space:nowrap;}
.agenda-solo .total{margin-top:18px; font-family:var(--mono); font-size:12px; text-transform:uppercase; color:var(--gray); text-align:right;}


.ponto-partida{display:inline-flex; align-items:center; gap:10px; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--red); margin-bottom:16px;}
.ponto-partida::before{content:""; width:22px; height:2px; background:var(--red); display:inline-block;}


.diag-acao{display:grid; grid-template-columns:1fr 1fr; gap:0; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
@media(max-width:820px){.diag-acao{grid-template-columns:1fr;}}
.diag-acao > div{padding:22px 24px;}
.diag-acao .diagnostico{background:var(--surface); border-right:1px solid var(--line);}
@media(max-width:820px){.diag-acao .diagnostico{border-right:none; border-bottom:1px solid var(--line);}}
.diag-acao .plano{background:linear-gradient(160deg, rgba(168,121,26,.08), var(--surface));}
.diag-acao .lbl{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; margin-bottom:12px; display:block;}
.diag-acao .diagnostico .lbl{color:var(--gray);}
.diag-acao .plano .lbl{color:var(--red);}
.diag-acao ul{list-style:none;}
.diag-acao li{padding:6px 0 6px 20px; position:relative; font-size:14.5px; line-height:1.55; color:var(--gray);}
.diag-acao li::before{content:"➔"; position:absolute; left:0; color:var(--red);}


.acao-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 20px;}
.acao-card .num{font-family:var(--mono); color:var(--red); font-size:11px; letter-spacing:.08em; margin-bottom:8px; display:block;}
.acao-card h4{font-size:15.5px; text-transform:uppercase; letter-spacing:.02em; margin-bottom:8px;}
.acao-card p{font-size:14px; color:var(--gray); line-height:1.55;}


.kpi-canvas{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px 22px;}
.kpi-canvas h4{font-size:15.5px; margin-bottom:14px; color:var(--white);}
.kpi-canvas .row{display:flex; gap:8px; font-size:14px; padding:6px 0; border-bottom:1px solid var(--line);}
.kpi-canvas .row:last-child{border-bottom:none;}
.kpi-canvas .row b{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; color:var(--red); min-width:110px;}
.kpi-canvas .row span{color:var(--gray);}


.problema-divisor{align-items:center; text-align:center;}
.problema-divisor .pnum{font-family:var(--display); font-size:clamp(61px,14vw,181px); font-weight:700; color:var(--surface-2); -webkit-text-stroke:1px var(--red-deep); line-height:1;}
.problema-divisor .ptitle{font-family:var(--mono); text-transform:uppercase; letter-spacing:.16em; color:var(--red); font-size:15px; margin-top:18px;}


.live-fill{display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--red); border:1px dashed var(--red-deep); border-radius:20px; padding:3px 10px; margin-bottom:10px;}
.live-fill::before{content:"○"; font-size:8px;}
.quad{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:22px;}
.quad .letter{font-family:var(--display); font-size:34px; font-weight:700; color:var(--red-deep); line-height:1; margin-bottom:10px;}
.quad h4{font-size:16px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px;}
.quad .def{font-size:14px; color:var(--gray); line-height:1.6; margin-bottom:12px;}
.quad .prompt{font-size:14px; color:var(--white); font-style:italic; border-top:1px dashed var(--line); padding-top:12px;}


#bloco-dores .quad{border:1.5px solid var(--red); transition:background .25s ease, transform .25s ease;}
#bloco-dores .quad h4{color:var(--red);}
#bloco-dores .quad:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
#bloco-dores .quad:hover li{color:var(--black);}
#bloco-dores .quad:hover li::before{color:var(--ouro-claro);}


.field-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; display:flex; gap:14px; align-items:flex-start;}
.field-card .badge{width:38px; height:38px; min-width:38px; border-radius:50%; border:1.5px solid var(--red-deep); display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; color:var(--red); font-size:12px; letter-spacing:.02em;}
.field-card.pending .badge{border-color:var(--red); background:var(--red); color:#fff;}
.field-card .body{flex:1;}
.field-card .k{font-family:var(--mono); text-transform:uppercase; font-size:10.5px; letter-spacing:.1em; color:var(--gray); margin-bottom:8px;}
.field-card .v{font-family:var(--display); font-size:16.5px; font-weight:700; margin-bottom:6px;}
.field-card .d{font-size:14px; color:var(--gray); line-height:1.5;}


#bloco-dados .field-card{border:1.5px solid var(--red); transition:background .25s ease, transform .25s ease;}
#bloco-dados .field-card .k{color:var(--red);}
#bloco-dados .field-card:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
#bloco-dados .field-card:hover .v{color:var(--black);}
#bloco-dados .field-card:hover .d{color:var(--black);}


#bloco-tecnicas .quad{border:1.5px solid var(--red); transition:background .25s ease, transform .25s ease;}
#bloco-tecnicas .quad h4{color:var(--red);}
#bloco-tecnicas .quad:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
#bloco-tecnicas .quad:hover li{color:var(--black);}
#bloco-tecnicas .quad:hover li::before{color:var(--ouro-claro);}


#bloco-comerciais .quad, #bloco-metas .quad, #bloco-design .quad{border:1.5px solid var(--red); transition:background .25s ease, transform .25s ease;}
#bloco-comerciais .quad h4, #bloco-metas .quad h4, #bloco-design .quad h4{color:var(--red);}
#bloco-comerciais .quad:hover, #bloco-metas .quad:hover, #bloco-design .quad:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
#bloco-comerciais .quad:hover li, #bloco-metas .quad:hover li, #bloco-design .quad:hover li{color:var(--black);}
#bloco-comerciais .quad:hover li::before, #bloco-metas .quad:hover li::before, #bloco-design .quad:hover li::before{color:var(--ouro-claro);}
#bloco-design .quad:hover .def{color:var(--black);}


.hero{justify-content:space-between;}
.hero-top{display:flex; justify-content:space-between; font-family:var(--mono); font-size:16px; text-transform:uppercase; color:var(--gray); letter-spacing:.08em;}
.hero-tag{font-family:var(--mono); color:var(--red); text-transform:uppercase; font-size:16px; letter-spacing:.14em; margin-bottom:18px;}
.hero-meta{display:flex; gap:40px; margin-top:20px; flex-wrap:wrap;}
.hero-meta .m .k{font-family:var(--mono); font-size:10.5px; color:var(--gray); text-transform:uppercase;}
.hero-meta .m .v{font-family:var(--display); font-size:22px; font-weight:700; margin-top:4px;}
.scrollcue{font-family:var(--mono); font-size:11px; color:var(--gray-dim); text-transform:uppercase; margin-top:30px;}
.consultor-tag{display:flex; align-items:center; gap:18px; margin-top:26px;}
.consultor-tag img{width:84px; height:84px; border-radius:50%; object-fit:cover; border:2px solid var(--red-deep);}
.consultor-tag .info{font-family:var(--mono); font-size:14px; text-transform:uppercase; letter-spacing:.06em; color:var(--gray);}
.consultor-tag .info b{display:block; color:var(--white); font-family:var(--body); font-size:18px; font-weight:600; text-transform:none; letter-spacing:0; margin-bottom:4px;}





.pausa{display:inline-flex; align-items:center; gap:10px; font-size:14px; color:var(--white); background:rgba(168,121,26,.12); border:1px solid var(--red-deep); border-radius:24px; padding:8px 18px 8px 12px; margin-top:22px; max-width:100%;}
.pausa svg{width:16px; height:16px; color:var(--red); flex-shrink:0;}
.pausa b{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--red); font-weight:600; white-space:nowrap;}



.fecho{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-top:18px;}
@media(max-width:820px){.fecho{grid-template-columns:1fr;}}
.fecho > div{padding:22px 24px; background:var(--surface); border-right:1px solid var(--line); transition:background .25s ease, transform .25s ease;}
.fecho > div:last-child{border-right:none; background:linear-gradient(160deg, rgba(168,121,26,.10), var(--surface));}
@media(max-width:820px){.fecho > div{border-right:none; border-bottom:1px solid var(--line);}}
.fecho > div:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
.fecho > div:hover li{color:var(--black);}
.fecho > div:hover li::before{color:var(--ouro-claro);}
.fecho .lbl{font-family:var(--mono); font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--red); margin-bottom:12px; display:block;}
.fecho ul{list-style:none;}
.fecho li{padding:6px 0 6px 18px; position:relative; font-size:16px; line-height:1.6; color:var(--gray);}
.fecho li::before{content:"➔"; position:absolute; left:0; color:var(--red);}
.gancho{margin-top:16px; display:flex; align-items:center; gap:14px; font-size:15.5px; color:var(--white); border-left:3px solid var(--red); padding:10px 0 10px 16px;}
.gancho b{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--red); white-space:nowrap;}


.flowchain{display:flex; align-items:stretch; flex-wrap:wrap; gap:0;}
.flowchain .fc{flex:1; min-width:150px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:16px 18px; transition:background .25s ease, transform .25s ease;}
.flowchain .fc.now{border-color:var(--red); background:linear-gradient(160deg, rgba(168,121,26,.16), var(--surface));}
.flowchain .fc .k{font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--red); margin-bottom:6px;}
.flowchain .fc h4{font-size:15.5px; margin-bottom:4px;}
.flowchain .fc p{font-size:12.5px; color:var(--gray); line-height:1.5;}
.flowchain .fc:hover{background:var(--vinho); border-color:var(--vinho); box-shadow:0 12px 28px var(--vinho-glow); transform:translateY(-3px);}
.flowchain .fc:hover h4{color:var(--black);}
.flowchain .fc:hover p{color:var(--gray-dim);}
.flowchain .ar{display:flex; align-items:center; justify-content:center; width:34px; color:var(--red); font-size:20px;}
@media(max-width:900px){.flowchain{flex-direction:column;} .flowchain .ar{width:auto; height:26px; transform:rotate(90deg);}}


.bridge-track .tk:not(:last-child)::after{content:"  →"; color:var(--red);}


.donut-wrap{display:grid; grid-template-columns:200px 1fr; gap:34px; align-items:center;}
@media(max-width:700px){.donut-wrap{grid-template-columns:1fr;}}
.donut-wrap svg{width:200px; height:200px;}
.donut-legend{display:flex; flex-direction:column; gap:12px;}
.donut-legend .it{display:flex; gap:12px; align-items:flex-start;}
.donut-legend .sw{width:12px; height:12px; border-radius:3px; margin-top:5px; flex-shrink:0;}
.donut-legend .k{font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--gray);}
.donut-legend .v{font-family:var(--display); font-weight:700; font-size:19px; margin-top:2px;}
.donut-legend .d{font-size:12.5px; color:var(--gray); margin-top:2px;}



.quad ul{list-style:none; margin-top:6px;}
.quad li{padding:7px 0 7px 20px; position:relative; font-size:14.5px; color:var(--white); line-height:1.5;}
.quad li::before{content:"?"; position:absolute; left:0; color:var(--red); font-family:var(--mono); font-weight:700;}
.pergunta-central{font-family:var(--display); font-size:clamp(25px,3.4vw,43px); font-weight:700; line-height:1.15; max-width:980px;}
.chips-rot{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}

<section class="hero"><div class="noise"></div><div class="v4-mark" aria-hidden="true"></div><div class="hero-top"></div></section>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var sections = Array.from(document.querySelectorAll('section'));
  var total = sections.length;
  var pc = document.getElementById('pagecount');
  if(pc){ pc.textContent = '· 01/' + String(total).padStart(2,'0'); }
  var navdots = document.getElementById('navdots');
  sections.forEach(function(s,i){
    var b = document.createElement('button');
    b.addEventListener('click', function(){ s.scrollIntoView({behavior:'smooth'}); });
    b.dataset.i = i;
    if(navdots) navdots.appendChild(b);
  });
  var dots = navdots ? Array.from(navdots.children) : [];
  var io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var idx = sections.indexOf(entry.target);
      if(entry.isIntersecting){
        entry.target.querySelectorAll('.r').forEach(function(el){ el.classList.add('in'); });
        dots.forEach(function(d){ d.classList.remove('active'); });
        if(dots[idx]) dots[idx].classList.add('active');
        if(pc) pc.textContent = '· ' + String(idx+1).padStart(2,'0') + '/' + String(total).padStart(2,'0');
      }
    });
  },{threshold:0.5});
  sections.forEach(function(s){ io.observe(s); });


  setTimeout(function(){
    document.querySelectorAll('.r:not(.in)').forEach(function(el){ el.classList.add('in'); });
  }, 2500);
});
</script>
